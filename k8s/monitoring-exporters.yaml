apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: exporter
        image: prometheuscommunity/postgres-exporter:v0.15.0
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://myuser:mypassword@db.car-app.svc.cluster.local:5432/cars_db?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-service # <--- Matches DNS prefix
  namespace: monitoring           # <--- Matches DNS middle
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
